<script type="text/javascript">
  RED.nodes.registerType('ghost-create', {
    category: 'Ghost Client',
    color: '#A3F5A3',
    defaults: {
      name: { value: '' },
      createPayload: { value: 'payload', required: true },
      createPayloadType: { value: 'msg' },
      createParamSource: { value: '' },
      createParamSourceType: { value: 'str' },
    },
    inputs: 1,
    outputs: 2,
    outputLabels: ["Success", "Error"],
    icon: "font-awesome/fa-plus-square",
    paletteLabel: "Create Post",
    label() {
      return this.name || "Create Ghost Post";
    },
    oneditprepare() {
      $('#node-input-createPayload').typedInput({
        type: 'json',
        types: ['json', 'msg', 'flow', 'global'],
        typeField: '#node-input-createPayloadType'
      });

      $('#node-input-createParamSource').typedInput({
        type: 'json',
        types: ['str', 'msg', 'flow', 'global'],
        typeField: '#node-input-createParamSourceType',
      });
    },
    oneditsave() { },
    oneditcancel() { },
    oneditdelete() { },
    oneditresize() { }
  });
</script>

<script type="text/x-red" data-template-name="ghost-create">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name">
  </div>
  <div class="form-row">
    <label for="node-input-createPayload"><i class="fa fa-file-text"></i> Post Payload</label>
    <input type="text" id="node-input-createPayload" placeholder='{"title":"My Post"}'>
    <input type="hidden" id="node-input-createPayloadType" />
  </div>
  <div class="form-row">
    <label for="node-input-createParamSource"><i class="fa fa-code"></i> Source</label>
    <input type="text" id="node-input-createParamSource" placeholder="html">
    <input type="hidden" id="node-input-createParamSourceType" />
  </div>
</script>

<script type="text/x-red" data-help-name="ghost-create">
  <p>
    The <strong>Create Post</strong> node sends a request to the Ghost Admin API to create a new blog post.
  </p>

  <p><strong>Inputs:</strong></p>
  <ul>
    <li>
      <strong>Post Payload</strong>: A valid JSON object representing the post content.<br>
      Example: <code>{ "title": "My Post", "html": "&lt;p&gt;Hello world&lt;/p&gt;" }</code><br>
      Supported types: <code>json</code>, <code>msg</code>, <code>flow</code>, <code>global</code>
    </li>
    <li>
      <strong>Source</strong>: Optional source string (e.g. <code>"html"</code>).<br>
      Supported types: <code>str</code>, <code>msg</code>, <code>flow</code>, <code>global</code>
    </li>
    <li>
      Requires a configured Ghost Admin API connection (Admin API URL and key).
    </li>
    <li>
      If the <code>authors</code> field is omitted in the payload, the configured Publisher Email from the Ghost Config node will be used.
    </li>
  </ul>

  <p><strong>Outputs:</strong></p>
  <ul>
    <li><strong>Output 1 (Success)</strong>: <code>msg.payload</code> contains the created post object.</li>
    <li><strong>Output 2 (Error)</strong>: <code>msg.error</code> contains an error object describing the failure.</li>
  </ul>

  <p>
    For more details, refer to the
    <a href="https://ghost.org/docs/admin-api/" target="_blank" rel="noopener noreferrer">
      Ghost Admin API documentation
    </a>.
  </p>
</script>
